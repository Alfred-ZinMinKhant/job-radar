<html><head><script id="job-posting-schema" type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Service Manager","description":"<b>หน้าที่และความรับผิดชอบหลัก (Key Responsibilities)</b>\nการบริหารจัดการกลยุทธ์และปฏิบัติการ (Strategic &amp; Operations Management):\n\nวางแผนและกำหนดเป้าหมาย (KPIs) ของฝ่ายบริการหลังการขาย เช่น อัตราความพึงพอใจของลูกค้า (CSAT), ระยะเวลาในการซ่อมแซมเฉลี่ย (TAT - Turnaround Time), และประสิทธิภาพการทำงานของช่างบริการ\n\nควบคุมและพัฒนาระบบการให้บริการทั้งในรูปแบบศูนย์บริการ (Service Center), การบริการนอกสถานที่ (On-site Service) และการประสานงานกับศูนย์บริการแต่งตั้งภายนอก (Authorized Service Centers)\n\nการบริหารทีมงานและพัฒนาบุคลากร (Team &amp; People Management):\n\nบริหารจัดการและพัฒนาศักยภาพทีมงานบริการ, เจ้าหน้าที่ Call Center, และทีมช่างเทคนิค ทั้งทักษะทางเทคนิค (Technical Skills) และทักษะการสื่อสาร/การบริการ (Soft Skills)\n\nจัดตารางการปฏิบัติงาน ประเมินผลงาน และสร้างแรงจูงใจในการทำงานให้กับทีม\n\nการจัดการอะไหล่และโลจิสติกส์ (Spare Parts &amp; Logistics Management):\n\nควบคุมการบริหารจัดการคลังอะไหล่เครื่องใช้ไฟฟ้า วางแผนการจัดซื้อและการสำรองอะไหล่ให้เพียงพอต่อความต้องการในการซ่อมแซมโดยไม่ให้มีสินค้าคงคลังล้นเกิน (Stock Control)\n\nประสานงานกับฝ่ายจัดซื้อและโรงงาน/ซัพพลายเออร์ต่างประเทศหรือในประเทศเพื่อติดตามสถานะอะไหล่\n\nการบริหารความสัมพันธ์ลูกค้าและการจัดการข้อร้องเรียน (Customer Relation &amp; Complaint Management):\n\nเป็นศูนย์กลางในการแก้ไขปัญหาและข้อร้องเรียนที่ซับซ้อนจากลูกค้า (Escalated Complaints) ด้วยความเป็นมืออาชีพและรวดเร็ว\n\nวิเคราะห์ข้อมูลเสียงสะท้อนของลูกค้า (Voice of Customer) เพื่อนำมาปรับปรุงคุณภาพสินค้าและบริการร่วมกับแผนกที่เกี่ยวข้อง (เช่น แผนก QA หรือ ฝ่ายพัฒนาผลิตภัณฑ์)\n\nการบริหารจัดการด้านงบประมาณและตัวชี้วัดทางธุรกิจ (Budgeting &amp; Financial Management):\n\nจัดทำและควบคุมงบประมาณประจำปีของฝ่ายบริการ\n\nบริหารจัดการรายได้จากการบริการ (Service Revenue) เช่น งานซ่อมหลังหมดประกัน, การขายสัญญาบริการเสริม (Extended Warranty), และการขายอะไหล่ เพื่อให้บรรลุเป้าหมายทางการ
