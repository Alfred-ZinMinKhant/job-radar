[project]
name = "jobradar"
version = "0.1.0"
description = "Private daily job-alert digest for Bangkok postings"
requires-python = ">=3.11"
dependencies = [
    "python-jobspy",
    "httpx",
    "selectolax",
    "pyyaml",
    "python-dotenv",
    "tenacity",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
