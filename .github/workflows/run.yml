# ENABLED. Note: GitHub runner IPs are often blocked by LinkedIn and Indeed, so
# a run here may come back with fewer results than a run from your own machine;
# blocked sources are named in the digest footer. To switch it off, add
# `if: false` under the job (see README).
#
# Needed repository secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# and CONFIG_LOCAL (the full contents of config.local.yaml).
name: job-radar
on:
  schedule:
    # GitHub starts scheduled runs late (often by hours), so fire early at an
    # off-peak minute and let the "Wait" step hold until 09:00 Asia/Bangkok.
    - cron: "47 23 * * *"   # 06:47 Asia/Bangkok (UTC+7)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency: job-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Restore database
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-
      - name: Write private profile
        env:
          CONFIG_LOCAL: ${{ secrets.CONFIG_LOCAL }}
        run: printf '%s' "$CONFIG_LOCAL" > config.local.yaml
      - name: Wait until 09:00 Asia/Bangkok
        if: github.event_name == 'schedule'
        run: |
          now=$(date +%s)
          target=$(TZ=Asia/Bangkok date -d "today 09:00" +%s)
          # started before 09:00 -> sleep; late runs go straight through
          if [ "$now" -lt "$target" ] && [ $((target - now)) -le 14400 ]; then
            sleep $((target - now))
          fi
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobradar run
